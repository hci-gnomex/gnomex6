buildscript {
  repositories { mavenCentral() }
}

plugins {
  id "com.github.node-gradle.node" version "7.1.0"
}

repositories {
  mavenCentral()
}

node {
  // Angular 7 works well with Node 10.x (you’re using 10.24.1)
  // If you want Gradle to manage Node automatically, uncomment these:
  // version = "10.24.1"
  // npmVersion = "6.14.12"
  // download = true

  // If you already have Node installed and want to use system Node, leave download=false (default)
  // download = false
}

def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")

// ----- Clean tasks -----
tasks.register('cleanAngularDist', NpmTask) {
  //ensure install has ran
  dependsOn tasks.named('npmInstallSmart')
  args = ['run', 'clean:dist']
}

tasks.register('cleanAngularAll', NpmTask) {
  // Uses: "clean": "npm cache clean --force && rimraf node_modules dist"
  args = ['run', 'clean']
}

// ----- Install task -----
// Prefer npm ci when there is a package-lock.json, otherwise fallback to npm install
tasks.register('npmInstallSmart') {
  dependsOn tasks.named('npmSetup') // from node-gradle plugin (safe even if system node)
  doLast {
    File lock = file("${projectDir}/package-lock.json")
    if (lock.exists()) {
      // npm ci is reproducible and faster for CI/build servers
      exec {
        workingDir projectDir
        if (isWindows) {
          commandLine "cmd", "/c", "npm", "ci"
        } else {
          commandLine "npm", "ci"
        }
      }
    } else {
      exec {
        workingDir projectDir
        if (isWindows) {
          commandLine "cmd", "/c", "npm", "install"
        } else {
          commandLine "npm", "install"
        }
      }
    }
  }
}

// ----- Build tasks (Angular CLI) -----
tasks.register('ngBuildDevTomcat', NpmTask) {
  // Runs: "build:dev:tomcat": "ng build -c developmentTomcat"
  dependsOn tasks.named('npmInstallSmart')
  dependsOn tasks.named('cleanAngularDist')
  args = ['run', 'build:dev:tomcat']
}

tasks.register('ngBuildProdTomcat', NpmTask) {
  // Runs: "build:prod:tomcat": "ng build -c productionTomcat"
  dependsOn tasks.named('npmInstallSmart')
  dependsOn tasks.named('cleanAngularDist')
  args = ['run', 'build:prod:tomcat']
}

// Optional: run dev server from Gradle (for local dev)
tasks.register('ngServeTomcat', NpmTask) {
  // Runs: "start": "ng serve -c developmentTomcat --proxy-config proxy.conf.json"
  dependsOn tasks.named('npmInstallSmart')
  args = ['run', 'start']
}
