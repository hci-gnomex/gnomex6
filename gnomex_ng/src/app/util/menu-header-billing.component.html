<div class="fit-content flex-container-row" role="toolbar" aria-label="Billing actions">
    <button mat-raised-button class="minimize" (click)="showBillingInvoice(false)" aria-label="Generate printable PDF invoice">
        <img class="icon" [src]="'./assets/page_white_acrobat.png'" alt="" aria-hidden="true">
        Printable PDF Invoice
    </button>
    <button mat-raised-button class="minimize" (click)="showBillingInvoice(true)" aria-label="Email invoice">
        <img class="icon" [src]="'./assets/email_open.png'" alt="" aria-hidden="true">
        Email Invoice
    </button>
    <button mat-raised-button class="minimize" (click)="showGeneralLedgerInterface()" aria-label="Open general ledger interface">
        <img class="icon" [src]="'./assets/feed_disk.png'" alt="" aria-hidden="true">
        General Ledger Interface
    </button>
    <button mat-raised-button class="minimize" [matMenuTriggerFor]="reportsMenu" aria-label="Reports menu" aria-haspopup="true">
        <img class="icon" [src]="'./assets/page.png'" alt="" aria-hidden="true">
        Reports...
    </button>
    <mat-menu #reportsMenu="matMenu" aria-label="Reports submenu">
        <button mat-menu-item (click)="showMonthendBillingReport()" aria-label="Show invoice report">
            Invoice Report
        </button>
        <button mat-menu-item
                matTooltip="Monthend Billing Report (uMerge Format)"
                matTooltipPosition="right"
                (click)="showMonthendBillingReport(true)"
                aria-label="Show monthend billing report in uMerge format">
            Monthend Billing Report (uMerge Format)
        </button>
        <button mat-menu-item
                matTooltip="Billing by Lab and Experiment Platform"
                matTooltipPosition="right"
                (click)="showBillingByLabReport()"
                aria-label="Show billing by lab and experiment platform">
            Billing by Lab and Experiment Platform
        </button>
        <button mat-menu-item (click)="showUsageReport()" aria-label="Show usage report">
            Usage Report
        </button>
        <button mat-menu-item (click)="showNotesToCore()" aria-label="Show notes to core">
            Notes to Core
        </button>
    </mat-menu>
    <button mat-raised-button class="minimize" (click)="refresh()" aria-label="Refresh billing data">
        <img class="icon" [src]="'./assets/refresh.png'" alt="" aria-hidden="true">
        Refresh
    </button>
</div>
