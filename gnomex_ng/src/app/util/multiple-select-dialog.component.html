<div class="full-width full-height flex-vertical-container" role="dialog" aria-labelledby="dialog-title">
    <div mat-dialog-title style="margin: 0; padding: 0.5em;">
        <h3 class="no-margin" id="dialog-title">
            {{optionName}}
        </h3>
    </div>
    <div mat-dialog-content class="full-width full-height stretch" style="margin: 0; padding: 0;" role="region" aria-label="Selection options">
        <div class="full-width full-height">
            <div class="full-height full-width" style="padding: .5em 2em;" appAgGridHeaderA11yFix>
                <ag-grid-angular
                        style="width:100%; height:100%;"
                        class="ag-theme-fresh"
                        [singleClickEdit]="true"
                        [rowSelection]="gridRowSelection"
                        [suppressRowClickSelection]="allowMultipleSelection"
                        [columnDefs]="columnDefinitions"
                        [enableSorting]="true"
                        [enableColResize]="true"
                        (gridSizeChanged)="onGridSizeChanged()"
                        (gridReady)="onGridReady($event)"
                        aria-label="Options selection grid"
                        [suppressTabbing]="true"
                        [ensureDomOrder]="true">
                </ag-grid-angular>
            </div>
        </div>
    </div>
    <div mat-dialog-actions style="margin: 0; display: block;" role="group" aria-label="Dialog actions">
        <div class="t full-width">
            <div class="tr">
                <div class="td right-align horizontal-padding">
                    <button mat-button cdkFocusInitial (click)="updateButtonClicked()" aria-label="Update selection">Update</button>
                    <button mat-button (click)="cancelButtonClicked()" aria-label="Cancel">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</div>
