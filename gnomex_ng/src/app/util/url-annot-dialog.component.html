<div style="height: 85%" role="dialog" aria-label="URL annotation editor">
    <url-annotation [formControl]="urlFormControl"></url-annotation>
    <div mat-dialog-actions class="no-margin" style="display: block;" role="group" aria-label="Dialog actions">
        <div class="t full-width">
            <div class="tr">
                <div class="td right-align horizontal-padding">
                    <button mat-button cdkFocusInitial (click)="updateButtonClicked()" aria-label="Update URL annotation">Update</button>
                    <button mat-button (click)="cancelButtonClicked()" aria-label="Cancel">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</div>
