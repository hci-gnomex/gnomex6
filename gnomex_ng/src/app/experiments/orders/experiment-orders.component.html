<div class="full-width full-height flex-column-container background" role="main" aria-label="Experiment Orders">
	<div class="full-width">
		<browse-filter
				[label]="'Orders'"
				[iconSource]="'assets/review.png'"
				[mode]="'orderBrowse'">
		</browse-filter>
	</div>
	<div class="vertical-spacer" aria-hidden="true">
	</div>
	<div class="full-width flex-stretch lower-panel" role="region" aria-label="Orders list">
		<div class="full-width full-height flex-column-container">
			<div class="full-width flex-stretch small-font" appAgGridHeaderA11yFix appFocusManager [focusManagerGrid]="experimentOrdersGrid">
				<div #oneEmWidth class="no-height single-em" aria-hidden="true"></div>
				<ag-grid-angular
						#experimentOrdersGrid
						class="ag-theme-fresh full-width full-height small-font"
						role="grid"
						aria-label="Orders data grid"
						[context]="context"
						[singleClickEdit]="true"
						[rowSelection]="'multiple'"
						[suppressRowClickSelection]="true"
						[enableSorting]="true"
						[enableColResize]="true"
						[suppressNoRowsOverlay]="true"
						[stopEditingWhenGridLosesFocus]="true"
						(gridSizeChanged)="onGridSizeChanged($event)"
						(gridReady)="onGridReady($event)">
				</ag-grid-angular>
			</div>
			<div class="full-width" role="toolbar" aria-label="Order actions">
				<div class="grid-footer">
					<div class="full-width t">
						<div class="tr">
							<div class="td most-width vertical-center">
								<div class="t">
									<div class="tr">
										<div class="td vertical-align title" role="status" aria-live="polite">
											{{gridApi?.getSelectedRows().length}} selected
										</div>
										<div class="td vertical-align">
											<custom-combo-box class="full-height full-width small-font" placeholder="- Change Status -"
															  [options]="dropdownChoices" displayField="label" valueField="value"
															  [(ngModel)]="changeStatus"
															  aria-label="Change status dropdown">
											</custom-combo-box>
										</div>
										<div class="td vertical-align">
											<button mat-button
													[disabled]="!enableChanges || (gridApi?.getSelectedRows().length === 0 || (changeStatus === null || changeStatus === ''))"
													(click)="goButtonClicked()"
													aria-label="Apply status change">
												<img *ngIf="gridApi?.getSelectedRows().length !== 0 && (changeStatus && changeStatus !== '')"
													 [src]="'./assets/bullet_go.png'"
													 alt="" aria-hidden="true" />
												<img *ngIf="gridApi?.getSelectedRows().length === 0 || (!changeStatus || changeStatus === '')"
													 [src]="'./assets/bullet_go_disable.png'"
													 alt="" aria-hidden="true"/>
												Go
											</button>
										</div>
										<div class="td vertical-align">
											<button mat-button
													[disabled]="!enableChanges || gridApi?.getSelectedRows().length === 0"
													(click)="deleteButtonClicked()"
													aria-label="Delete selected orders">
												<img *ngIf="gridApi?.getSelectedRows().length !== 0" [src]="'./assets/delete.png'" alt="" aria-hidden="true" />
												<img *ngIf="gridApi?.getSelectedRows().length === 0" [src]="'./assets/delete_disable.png'" alt="" aria-hidden="true"/>
												Delete
											</button>
										</div>
										<div class="td vertical-align">
											<button mat-button
													[disabled]="gridApi?.getSelectedRows().length === 0"
													(click)="emailButtonClicked()"
													aria-label="Email selected orders">
												<img *ngIf="gridApi?.getSelectedRows().length !== 0" [src]="'./assets/email_go.png'" alt="" aria-hidden="true" />
												<img *ngIf="gridApi?.getSelectedRows().length === 0" [src]="'./assets/email_go_disable.png'" alt="" aria-hidden="true"/>
												Email
											</button>
										</div>
									</div>
								</div>
							</div>
							<div *ngIf="message" class="td vertical-center right-align" role="status" aria-live="polite">
								({{message}})
							</div>
							<div class="td vertical-center right-align" role="status" aria-live="polite">
								({{(experiments?.length === null) ? 0 : experiments?.length + (experiments?.length != 1 ? " orders" : " order")}})
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
