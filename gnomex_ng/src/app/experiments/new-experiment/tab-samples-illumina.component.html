<div class="full-height full-width small-font" role="region" aria-label="Samples Configuration">
    <form [formGroup]="form" class="full-height full-width flex-container-col" role="form" aria-label="Samples form">
        <div class="full-width flex-grow flex-container-col">
            <div class="full-width flex-container-row align-center padded" role="toolbar" aria-label="Sample actions">
                <context-help *ngIf="(_state === this.STATE_NEW || _state === this.STATE_EDIT) && experiment?.isExternal !== 'Y'"
                              name="samplesTabHelp"
                              [hasEditPermission]="this.createSecurityAdvisor.isAdmin"
                              popupTitle="Samples Tab Instructions" label="Instructions"
                              [idCoreFacility]="this._experiment.idCoreFacility"
                              [codeRequestCategory]="this.requestCategoryType">
                </context-help>

                <div class="flex-container-row" *ngIf="(_state === this.STATE_NEW || _state === this.STATE_EDIT) && !this.isAmendState" role="group" aria-label="Add or remove samples">
                    <button mat-button class="padded-right" (click)="onAddSample()" aria-label="Add new sample">
                        <img class="icon" [src]="this.constService.ICON_ADD" alt="" aria-hidden="true">
                        Add sample
                    </button>
                    <button mat-button class="padded-right" (click)="onRemoveSamples()" [disabled]="selectedSamples.length < 1" aria-label="Remove selected samples">
                        <img class="icon" [src]="this.constService.ICON_DELETE" alt="" aria-hidden="true">
                        Remove samples
                    </button>
                    <context-help name="addSampleHelp"
                                  [hasEditPermission]="this.createSecurityAdvisor.isAdmin"
                                  popupTitle="Add/Remove Samples Help" label="">
                    </context-help>
                </div>

                <button *ngIf="_state === this.STATE_NEW || _state === this.STATE_EDIT" mat-button
                        class="padded-right"
                        color="link"
                        matTooltip="Upload Sample Sheet&#13;tab delimited txt file"
                        (click)="upload()"
                        aria-label="Upload sample sheet">
                    <img class="icon" [src]="constService.ICON_UPLOAD" alt="" aria-hidden="true">
                    Upload Sample Sheet
                </button>
                <context-help *ngIf="_state === this.STATE_NEW || _state === this.STATE_EDIT"
                              name="uploadSampleSheetHelp"
                              [hasEditPermission]="this.createSecurityAdvisor.isAdmin"
                              popupTitle="Upload Sample Sheet Instructions">
                </context-help>
                <input type="file" #fileInput accept=".txt" class="hidden" (change)="onFileSelected($event)" multiple aria-label="File input for sample sheet">
                <button mat-button
                        class="padded-right"
                        color="link"
                        matTooltip=""
                        (click)="download()"
                        aria-label="Download sample sheet">
                    <img class="icon" [src]="constService.ICON_DOWNLOAD" alt="" aria-hidden="true">
                    Download Sample Sheet
                </button>
                <mat-checkbox *ngIf="this.showCcCheckbox" #ccCheckbox class="double-left-padded" (change)="toggleCC($event)" aria-label="Enter CC Numbers">Enter CC Numbers</mat-checkbox>
            </div>
            <div class="full-width flex-grow" appAgGridHeaderA11yFix appFocusManager>
                <div #oneEmWidth class="no-height single-em" aria-hidden="true"></div>
                <ag-grid-angular class="ag-theme-fresh full-height full-width"
                                 role="grid"
                                 aria-label="Samples data grid"
                                 stopEditingWhenGridLosesFocus="true"
                                 [context]="context"
                                 [animateRows]="true"
                                 [getNodeChildDetails]="nodeChildDetails"
                                 [enableColResize]="true"
                                 [rowSelection]="'multiple'"
                                 [singleClickEdit]="true"
                                 [rowDeselection]="true"
                                 (selectionChanged)="onSelectionChanged($event)"
                                 (cellValueChanged)="onCellValueChanged($event)"
                                 (gridReady)="this.onSamplesGridReady($event)">
                </ag-grid-angular>
            </div>
        </div>
    </form>
</div>
