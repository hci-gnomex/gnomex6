    <form [formGroup]="this.form" class="flex-container-col full-width full-height double-padded" aria-label="Price sheet details">
        <div>
            <mat-form-field class="full-width">
                <input matInput placeholder="Name" [formControlName]="'name'" aria-label="Price sheet name">
            </mat-form-field>
        </div>
        <div>
            <mat-checkbox [formControlName]="'active'" aria-label="Price sheet is active">Active</mat-checkbox>
        </div>
        <div>
            <mat-form-field class="full-width">
                <textarea matInput placeholder="Notes" [formControlName]="'notes'" aria-label="Price sheet notes"
                          matTextareaAutosize matAutosizeMinRows="3" matAutosizeMaxRows="3"></textarea>
            </mat-form-field>
        </div>
        <div>
            <label>Price Sheet applies to</label>
        </div>
        <div role="toolbar" aria-label="Experiment platform actions">
            <button mat-button (click)="this.addExperimentPlatform()" aria-label="Add experiment platform"><img [src]="'./assets/add.png'" class="icon" alt="Add">Add</button>
            <button mat-button [disabled]="!this.selectedExperimentPlatform" (click)="this.removeExperimentPlatform()" aria-label="Remove selected experiment platform"><img [src]="'./assets/delete.png'" class="icon" alt="Remove">Remove</button>
        </div>
        <div class="grid-div" appAgGridHeaderA11yFix>
            <ag-grid-angular class="ag-theme-balham full-height full-width"
                             aria-label="Experiment platforms table"
                             (gridReady)="this.onGridReady($event)"
                             (gridSizeChanged)="this.onGridSizeChanged($event)"
                             (selectionChanged)="this.onGridSelectionChanged($event)"
                             [singleClickEdit]="true"
                             [stopEditingWhenGridLosesFocus]="true"
                             [rowSelection]="'single'"
                             [rowData]="this.experimentPlatforms">
            </ag-grid-angular>
        </div>
    </form>
