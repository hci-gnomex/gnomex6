<mat-menu #childMenu="matMenu" [id]="menuId" role="menu">
  <span *ngFor="let child of items">
    <!-- Handle branch node menu items -->
    <span *ngIf="child.children && child.children.length > 0">
      <button mat-menu-item
              color="primary"
              [hidden]="child.hidden"
              [matMenuTriggerFor]="menu.childMenu"
              aria-haspopup="menu"
              [attr.aria-label]="child.displayName + ' submenu'">
        <img class="icon" *ngIf="child.iconName" src="{{child.iconName}}" [attr.alt]="child.displayName + ' icon'">
        <span>{{child.displayName}}</span>
      </button>
      <app-menu-item #menu [items]="child.children"></app-menu-item>
    </span>
    <!-- Handle leaf node menu items -->
    <span *ngIf="!child.children || child.children.length === 0">
      <span *ngIf="child.divider===undefined;else divider">
        <button *ngIf="child.callback" mat-menu-item
                class="child.class"
                [hidden]="child.hidden"
                (click)="child.callback(child?.params)"
                role="menuitem"
                [attr.aria-label]="child.displayName">
          <img class="icon" *ngIf="child.iconName" src="{{child.iconName}}" [attr.alt]="child.displayName + ' icon'">
          <span>{{child.displayName}}</span>
        </button>
        <button *ngIf="!child.callback" mat-menu-item
                class="child.class"
                [hidden]="child.hidden"
                (click)="setNavModeType()"
                [routerLink]="child.route" [queryParams]="{id:child.idCoreFacility}"
                role="menuitem"
                [attr.aria-label]="child.displayName">
          <img class="icon" *ngIf="child.iconName" src="{{child.iconName}}" [attr.alt]="child.displayName + ' icon'">
          <span>{{child.displayName}}</span>
        </button>
      </span>
    </span>
  </span>
</mat-menu>
<ng-template #divider>
  <mat-divider role="separator"></mat-divider>
</ng-template>
