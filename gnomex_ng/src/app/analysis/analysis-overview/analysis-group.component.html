<form style="height:100%; width:100%; display:flex; flex-direction: column;" (ngSubmit)="save()" [formGroup]="projectBrowseForm"
      aria-label="Analysis group form">

    <mat-form-field style="flex:1; width:calc(100% - 2em); margin:1em; "> <!-- accounting for margin space in width percentages -->
        <input matInput type="text" formControlName="name" placeholder="Name" aria-label="Analysis group name"
               aria-required="true"/>
        <mat-error *ngIf="projectBrowseForm.get('name').hasError('required')" role="alert">
            Analysis Group Name is required
        </mat-error>
    </mat-form-field>

    <div style="display:flex; flex-direction:column; flex:5;
                width:calc(100% - 2em); margin:1em;" role="group" aria-label="Description section"> <!-- accounting for margin space in width percentages -->
        <label  for="description" > Description </label>
        <textarea id="description" style="width:100%;height:100%; resize:none;"
                  formControlName="description" placeholder="Description"
                  aria-label="Analysis group description"
                  aria-describedby="description-error">
        </textarea>
        <div id="description-error" style="color:red" role="alert" *ngIf="projectBrowseForm.get('description').hasError('maxlength')
                                        && projectBrowseForm.get('description').touched">
            Description exceeded the 500 character limit
        </div>
    </div>


</form>
