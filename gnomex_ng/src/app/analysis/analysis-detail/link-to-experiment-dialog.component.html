<div class="padded-inner" role="dialog" aria-labelledby="link-experiment-title">
    <div id="link-experiment-title" class="dialog-title">Link to Experiment</div>
    <div class="flex-container-row" role="search" aria-label="Filter experiments">
        <mat-form-field class="flex-grow">
            <input matInput [formControl]="numberControl" type="text"
                   placeholder="Filter by experiment number"
                   aria-label="Filter by experiment number"/>
        </mat-form-field>
        <div class="flex-grow" style="margin-left: 1em">
            <custom-combo-box placeholder="Filter by Lab"
                              [options]="this.labList"
                              displayField="name" valueField="idLab"
                              [formControl]="labControl"
                              aria-label="Filter by lab">
            </custom-combo-box>
        </div>
    </div>

    <div style="height:25em; width: 100%; margin-top:0.5em;" role="region" aria-label="Experiment selection" appAgGridHeaderA11yFix>
        <ag-grid-angular #linkExperimentGrid style="width: 100%; height: 100%;" class="ag-theme-fresh"
                         [rowData]="rowData"
                         [columnDefs]="columnDefs"
                         [rowSelection]="'single'"
                         (gridSizeChanged)="gridSizeChanged($event)"
                         (rowSelected)="experimentRowSelected($event)"
                         [enableSorting]="true"
                         [enableColResize]="true"
                         [rowDeselection]="true"
                         (gridReady)="onGridReady($event)"
                         aria-label="Available experiments grid"
                         [suppressTabbing]="true"
                         [ensureDomOrder]="true">
        </ag-grid-angular>
    </div>
</div>
