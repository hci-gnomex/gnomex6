<div class="full-width full-height flex-container-col background major-border padded overflow-auto" role="main" aria-label="Browse analysis">
    <div class="full-width full-height flex-container-col foreground">
        <div class="full-width" role="search" aria-label="Analysis">
            <browse-filter [label]="'Analysis'"
                           [iconSource]="'assets/map.png'"
                           [mode]="'analysisBrowse'">
            </browse-filter>
        </div>
        <div class="full-width vertical-spacer background">
        </div>
        <div class="full-width flex-container-row flex-grow overflow-auto">
            <div class="full-width full-height max-height">
                <as-split>
                    <as-split-area size="20">
                        <div class="full-width full-height foreground border flex-container-col" role="navigation" aria-label="Analysis navigation"> <!-- start tree container -->
                            <div *ngIf="showDragDropHint" class="full-width padded" role="status" aria-live="polite">
                                <div class="background-lightyellow allow-line-breaks padded">{{ this.DRAG_AND_DROP_HINT }}
                                </div>
                            </div>
                            <div class="full-width flex-container-row align-center padded">
                                <div class="full-height major-left-right-padded no-word-wrap flex-container-col align-center justify-center"
                                     aria-live="polite">
                                    <label>{{analysisCount}} analyses</label>
                                </div>
                                <div class="flex-grow">
                                </div>
                                <div>
                                    <button mat-button aria-label="Show drag-and-drop hint" (click)="dragDropHintClicked()"
                                            [disabled]="this.createSecurityAdvisorService.isGuest" [matTooltip]="this.DRAG_AND_DROP_HINT">
                                        <img [src]="'./assets/information.png'" alt="" aria-hidden="true" class="icon">
                                        Drag-and-drop hint
                                    </button>
                                </div>
                            </div>
                            <div  class="full-width flex-grow left-right-padded no-overflow" role="region" aria-label="Analysis tree">
                                <div appFocusManager [focusManagerTree]="analysisTree"  class="full-width full-height border">
                                    <p id="analysis-tree-kb-instructions" class="sr-only">{{KB_MOVE_INSTRUCTIONS}}</p>
                                    <tree-root #analysisTree
                                               [nodes]="items"
                                               [options]="options"
                                               (activate)="treeOnSelect($event)"
                                               (updateData)="treeUpdateData($event)"
                                               role="tree"
                                               aria-label="Analysis groups and analyses"
                                               aria-describedby="analysis-tree-kb-instructions">
                                        <ng-template #treeNodeTemplate let-node let-index="index">
                                            <div class="full-width no-word-wrap tree-node-font"
                                                 role="treeitem"
                                                 [attr.aria-label]="node.data.label"
                                                 [attr.aria-roledescription]="nodeRoleDesc(node)"
                                                 [attr.aria-selected]="isKbDropTarget(node) ? 'true' : null">
                                                <img src="{{node.data.icon}}" alt="" aria-hidden="true" class="tree-node-icon icon">
                                                <span>{{ node.data.label }}</span>
                                                <button *ngIf="node.isLeaf && node.data.idAnalysis && !createSecurityAdvisorService.isGuest"
                                                        class="sr-only-focusable"
                                                        [attr.aria-label]="'Move ' + node.data.label"
                                                        (click)="openMoveDialog(node, $event)">Move…</button>
                                            </div>
                                        </ng-template>
                                        <ng-template #loadingTemplate></ng-template>
                                    </tree-root>
                                </div>
                            </div>
                            <div class="full-width padded" role="toolbar" aria-label="Analysis actions">
                                <div class="t">
                                    <div class="tr">
                                        <div class="td">
                                            <button mat-button [disabled]="disableNewAnalysis || this.disableAll" (click)="createAnalysisClicked($event)"
                                                    aria-label="Create new analysis">
                                                <img [src]="'./assets/map.png'" alt="" aria-hidden="true">
                                                New Analysis
                                            </button>
                                        </div>
                                        <div class="td">
                                            <button mat-button [disabled]="disableDelete || this.disableAll" (click)="deleteAnalysisClicked($event)"
                                                    aria-label="Delete selected analysis or group">
                                                <img class="exit" [src]="'./assets/delete.png'" alt="" aria-hidden="true">
                                                Delete
                                            </button>
                                        </div>
                                    </div>
                                    <div class="tr">
                                        <div class="td">
                                            <button mat-button [disabled]="disableNewAnalysisGroup || this.disableAll" (click)="createAnalysisGroupClicked($event)"
                                                    aria-label="Create new analysis group">
                                                <img [src]="'./assets/folder_add.png'" alt="" aria-hidden="true">
                                                New analysis group
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div> <!-- end tree container -->
                    </as-split-area>
                    <as-split-area size="80">
                        <div class="full-width full-height border padded" role="region" aria-label="Analysis details panel">
                            <analysis-panel></analysis-panel>
                        </div>
                    </as-split-area>
                </as-split>
            </div>
        </div>
    </div>
</div>
